<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Dash</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#07040f;color:#e8f4ff;font-family:"Trebuchet MS",system-ui,sans-serif;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(7,4,15,.7);padding:16px;text-align:center;overflow:auto}
.scr.on{display:flex}
h1,h2{color:#fff;letter-spacing:.1em;text-shadow:0 0 10px #0ff,0 0 30px #0ff,0 0 60px #f0c}
h1{font-size:clamp(40px,10vw,90px)}h2{font-size:clamp(26px,6vw,44px)}
.b{min-width:220px;padding:13px 26px;font:700 18px "Trebuchet MS",system-ui,sans-serif;color:#fff;background:rgba(0,240,255,.08);border:2px solid #0ff;border-radius:12px;box-shadow:0 0 14px rgba(0,255,255,.55),inset 0 0 14px rgba(0,255,255,.2);cursor:pointer;transition:.15s}
.b:hover{background:rgba(0,240,255,.25);transform:scale(1.04)}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;width:min(900px,100%)}
.card{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:4px;padding:14px;color:#fff;text-align:left;font:inherit;background:rgba(255,255,255,.05);border:2px solid hsl(var(--h),100%,60%);border-radius:12px;box-shadow:0 0 12px hsla(var(--h),100%,60%,.5);cursor:pointer}
.card em{color:hsl(var(--h),100%,70%);font-style:normal}.card span{font-size:13px;opacity:.8;margin-bottom:6px}
.card i{position:absolute;left:0;bottom:0;height:4px;background:hsl(var(--h),100%,60%)}
#hud{position:fixed;left:0;right:0;top:0;display:none;padding:env(safe-area-inset-top) 12px 0;pointer-events:none}
#bar{height:8px;margin-top:8px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
#fill{display:block;height:100%;width:0;background:linear-gradient(90deg,#0ff,#f0c);box-shadow:0 0 12px #0ff}
.row{display:flex;gap:14px;align-items:center;margin-top:6px;font-weight:700;font-size:14px;text-shadow:0 0 8px #0ff}
.row .sp{flex:1}
.ic{pointer-events:auto;width:42px;height:42px;border-radius:50%;border:2px solid #0ff;background:rgba(0,0,0,.4);color:#fff;font-size:16px;cursor:pointer}
.set{display:grid;grid-template-columns:auto auto;gap:12px 22px;align-items:center;text-align:left}
.big{animation:pop 1s ease-out,gl 1.2s infinite alternate}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes gl{to{filter:brightness(1.6)}}
small{opacity:.7}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud"><div id="bar"><i id="fill"></i></div><div class="row"><span id="lvn"></span><span id="pc">0%</span><span id="sc">Skor 0</span><span class="sp"></span><button id="bp" class="ic" aria-label="Jeda">❚❚</button><button id="br" class="ic" aria-label="Ulangi">↻</button></div></div>

<div id="menu" class="scr on"><h1>NEON DASH</h1><p>Lompat, hindari duri, ikuti beat.</p>
<button class="b" id="mPlay">▶ Play</button><button class="b" id="mLv">Level Select</button><button class="b" id="mSet">Settings</button>
<small>SPACE / klik / tap = lompat · P = jeda · R = ulang</small></div>

<div id="lvs" class="scr"><h2>Pilih Level</h2><div id="grid"></div><button class="b" data-go="menu">Kembali</button></div>

<div id="set" class="scr"><h2>Settings</h2><div class="set">
<label for="oM">Musik</label><input type="checkbox" id="oM">
<label for="vM">Volume musik</label><input type="range" id="vM" min="0" max="1" step=".05">
<label for="oS">Efek suara</label><input type="checkbox" id="oS">
<label for="vS">Volume efek</label><input type="range" id="vS" min="0" max="1" step=".05">
<label for="oP">Efek glow</label><input type="checkbox" id="oP"></div>
<button class="b" data-go="menu">Kembali</button></div>

<div id="pause" class="scr"><h2>Jeda</h2><button class="b" id="pR">Lanjut</button><button class="b" id="pX">Ulangi level</button><button class="b" data-go="menu">Menu utama</button></div>

<div id="win" class="scr"><h2 class="big">LEVEL SELESAI! 100%</h2><p id="wt"></p>
<button class="b" id="wN">Level berikutnya</button><button class="b" id="wR">Main lagi</button><button class="b" data-go="menu">Menu utama</button></div>

<script>
'use strict';
const $=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d');
const U=30,H=400,GY=330,GR=2900,JV=640,PXR=.26,hsl=(h,s,l,a=1)=>`hsla(${h},${s}%,${l}%,${a})`;
let W,S,DPR;
function rs(){DPR=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;S=innerHeight/H;W=innerWidth/S}
addEventListener('resize',rs);rs();

/* ===== Data & penyimpanan ===== */
const LV=[
{n:'Sunrise Circuit',d:'Easy',bpm:120,sp:300,sec:40,h:190,seed:7,cp:0,root:57,prog:[0,-4,-2,-5],arp:[0,3,7,12,7,3],lead:0,hat:1,pool:[0,0,1,5,3,4]},
{n:'Pulse Highway',d:'Normal',bpm:136,sp:340,sec:46,h:140,seed:21,cp:1,root:55,prog:[0,3,-2,-4],arp:[0,7,12,10,7,3],lead:1,hat:1,pool:[0,1,2,3,4,5,7,8]},
{n:'Laser Labyrinth',d:'Hard',bpm:152,sp:380,sec:50,h:285,seed:33,cp:1,root:52,prog:[0,0,-4,-2],arp:[0,3,7,10,12,15,12,7],lead:1,hat:2,pool:[1,2,3,4,5,6,7,8]},
{n:'Cyber Inferno',d:'Insane',bpm:168,sp:420,sec:54,h:20,seed:47,cp:1,root:50,prog:[0,-2,-4,-5],arp:[0,3,7,12,15,19,15,12],lead:2,hat:2,pool:[2,3,5,6,7,8,9,1]},
{n:'Neon Apocalypse',d:'Extreme',bpm:184,sp:460,sec:60,h:320,seed:99,cp:1,root:48,prog:[0,3,-2,-4],arp:[0,12,7,15,3,19,10,14],lead:2,hat:2,pool:[2,3,6,7,8,9,5,9]}];
let sv={best:[],o:{m:1,s:1,p:1,vm:.7,vs:.8}};
try{const d=JSON.parse(localStorage.getItem('neondash')||'{}');if(d.best)sv.best=d.best;if(d.o)Object.assign(sv.o,d.o)}catch(e){}
const save=()=>{try{localStorage.setItem('neondash',JSON.stringify(sv))}catch(e){}},O=sv.o;

/* ===== Audio (sintesis WebAudio, tanpa file) ===== */
let AC,sfxg,mg,aS=0,ns=0,nb;
const mf=x=>440*2**((x-69)/12);
function ac(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();sfxg=AC.createGain();sfxg.connect(AC.destination);nb=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}if(AC.state==='suspended')AC.resume()}
function tone(t,f,d,ty,v,o,sl){const s=AC.createOscillator(),n=AC.createGain();s.type=ty;s.frequency.setValueAtTime(f,t);if(sl)s.frequency.exponentialRampToValueAtTime(sl,t+d);n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(n);n.connect(o);s.start(t);s.stop(t+d+.02)}
function nz(t,d,v,o,hp){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),n=AC.createGain();s.buffer=nb;f.type='highpass';f.frequency.value=hp;n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(n);n.connect(o);s.start(t);s.stop(t+d)}
function sfx(k){if(!AC||!O.s)return;sfxg.gain.value=O.vs;const t=AC.currentTime;
 if(k==='j')tone(t,420,.13,'square',.18,sfxg,820);
 else if(k==='d'){nz(t,.45,.6,sfxg,300);tone(t,220,.4,'sawtooth',.3,sfxg,40)}
 else if(k==='w')[60,64,67,72,76,79].forEach((n,i)=>tone(t+i*.09,mf(n),.3,'triangle',.25,sfxg));
 else if(k==='c')tone(t,mf(84),.2,'sine',.25,sfxg)}
const sd=()=>60/LV[cur].bpm/4;
function stopM(){if(mg){const o=mg;o.gain.setTargetAtTime(0,AC.currentTime,.05);setTimeout(()=>o.disconnect(),400);mg=null}}
function startM(T0){if(!AC||!O.m)return;stopM();mg=AC.createGain();mg.gain.value=O.vm*.5;mg.connect(AC.destination);aS=AC.currentTime+.05-T0;ns=Math.ceil(T0/sd()-1e-6)}
function ms(s,t){const L=LV[cur],b=s%16,bar=(s>>4)&3,r=L.root+L.prog[bar];
 if(b%4==0)tone(t,160,.2,'sine',1,mg,45);
 if(b==4||b==12)nz(t,.14,.45,mg,1800);
 if(L.hat==2?b%2:b%4==2)nz(t,.05,.22,mg,7500);
 if(b%2==0)tone(t,mf(r-12+(b%8==6?12:0)),.17,'sawtooth',.2,mg);
 if(L.lead&&(L.lead>1||b%2==0))tone(t,mf(r+12+L.arp[(s+bar*3)%L.arp.length]),.11,'square',.06,mg)}
function sched(){if(!mg)return;const d=sd(),n=AC.currentTime;while(aS+ns*d<n+.15){if(aS+ns*d>=n-.02)ms(ns,aS+ns*d);ns++}}

/* ===== Pembuat level (pola disusun pada grid beat) ===== */
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function mk(i){const L=LV[i],r=rng(L.seed),ob=[],bl=[],pit=[],tot=Math.floor(L.sec*L.sp/U/5)*5,jd=L.sp*.441,
 ex=[[3,5],[2,4],[1,3],[0,2],[0,1]][i],mp=Math.max(2,Math.floor(jd*.6/U));
 const sp=x=>ob.push(x*U),b=(x,w,h)=>bl.push({x:x*U,w:w*U,h:h*U});let c=15,cp=0;
 while(c<tot-15){if(L.cp&&!cp&&c>=tot/2)cp=(c-5)*U;
  const k=L.pool[r()*L.pool.length|0];let w=1;
  if(k==0)sp(c);
  else if(k==1){sp(c);sp(c+1);w=2}
  else if(k==2){sp(c);sp(c+1);sp(c+2);w=3}
  else if(k==3){b(c,1,1);sp(c+3);w=4}
  else if(k==4){w=2+(r()*3|0);b(c,w,1);sp(c+w+2);w+=3}
  else if(k==5){const p=2+(r()*(mp-1)|0);pit.push({x:c*U,w:p*U});w=p}
  else if(k==6){b(c,3,1);b(c+3,2,2);sp(c+5+Math.ceil(jd/U));w=6+Math.ceil(jd/U)}
  else if(k==7){sp(c);sp(c+3);w=4}
  else if(k==8){pit.push({x:c*U,w:2*U});sp(c+2+Math.ceil(jd/U));w=3+Math.ceil(jd/U)}
  else{for(let j=0;j<4;j++)sp(c+j);w=4}
  const gp=Math.ceil(Math.max(0,jd-w*U)/U)+ex[0]+(r()*(ex[1]-ex[0]+1)|0);
  c=Math.ceil((c+w+gp)/5)*5}
 const segs=[];let xs=-3000;for(const p of pit){segs.push([xs,p.x]);xs=p.x+p.w}segs.push([xs,tot*U+3000]);
 return{ob,bl,pit,segs,end:tot*U,cp}}

/* ===== State ===== */
let cur=0,lv=mk(0),state='menu',px=0,py=0,vy=0,rot=0,og=true,held=false,cpx=0,att=1,dtimer=0,flash=0,note=0,mt=0,acc=0,pts=[],prev='play';
const stars=Array.from({length:80},()=>({x:Math.random()*2400,y:Math.random()*GY,z:.08+Math.random()*.4,s:1+Math.random()*2,c:Math.random()*60}));
const R=Math.random;
function show(id){['menu','lvs','set','pause','win'].forEach(s=>$(s).classList.toggle('on',s===id));$('hud').style.display=id?'none':'block'}
function spawn(x0){px=x0;py=GY-30;vy=0;rot=0;og=true;pts=[];acc=0;state='play';startM(x0/LV[cur].sp)}
function startLevel(i){ac();cur=i;lv=mk(i);cpx=0;att=1;$('lvn').textContent=(i+1)+'. '+LV[i].n+' ('+LV[i].d+')';show('');spawn(0)}
function restart(){cpx=0;att++;spawn(0)}
function rec(p,s){const b=sv.best[cur]||{p:0,s:0};if(p>b.p)b.p=p;if(s>b.s)b.s=s;sv.best[cur]=b;save()}
function burst(n,h,sp,l,gv){for(let i=0;i<n;i++){const a=R()*6.28,v=R()*sp;pts.push({x:px+15,y:py+15,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.3,l:l*(.5+R()),m:l,h:h+R()*60-30,s:3+R()*6,g:gv})}}
function die(){state='dead';dtimer=.8;stopM();sfx('d');flash=1;burst(46,LV[cur].h+60,420,.9,900);rec(Math.min(99,Math.floor(px/lv.end*100)),Math.floor(px/10))}
function win(){state='win';stopM();sfx('w');px=lv.end;rec(100,Math.floor(lv.end/10)+1000);
 $('wt').textContent='Skor '+(Math.floor(lv.end/10)+1000)+' · Percobaan '+att;$('wN').style.display=cur<LV.length-1?'':'none';show('win');
 for(let i=0;i<140;i++)pts.push({x:px+R()*W*.5-W*.2,y:-R()*H,vx:R()*120-60,vy:R()*160+60,l:3+R()*2,m:5,h:R()*360,s:4+R()*5,g:120})}
function pause(){if(state!=='play')return;state='pause';if(AC)AC.suspend();show('pause')}
function resume(){if(state!=='pause')return;show('');state='play';if(AC)AC.resume()}
function menu(){stopM();state='menu';lv=mk(cur);show('menu')}

/* ===== Fisika (langkah tetap 120 Hz) ===== */
function step(dt){const L=LV[cur],pb=py+30;let dead=false;
 if(held&&og){vy=-JV;og=false;sfx('j')}
 px+=L.sp*dt;vy+=GR*dt;py+=vy*dt;og=false;const cx=px+15;
 for(const b of lv.bl){if(b.x>px+60||b.x+b.w<px-5)continue;
  if(px+28>b.x&&px+2<b.x+b.w){const top=GY-b.h;if(py+30>top+.01&&py<GY){if(pb<=top+9&&vy>=0){py=top-30;vy=0;og=true}else dead=true}}}
 const inP=lv.pit.some(p=>cx>p.x&&cx<p.x+p.w);
 if(!inP&&py+30>=GY&&vy>=0){if(pb<=GY+9){py=GY-30;vy=0;og=true}else if(py+30>GY+12)dead=true}
 for(const s of lv.ob){if(s>px+40||s<px-40)continue;if(px+25>s+9&&px+5<s+21&&py+25>GY-24&&py+5<GY)dead=true}
 if(py>H+40)dead=true;
 if(og)rot=Math.round(rot/(Math.PI/2))*Math.PI/2;else rot+=dt*Math.PI/.44;
 if(lv.cp&&px>=lv.cp&&cpx<lv.cp){cpx=lv.cp;note=1.4;sfx('c')}
 if(dead)die();else if(px>=lv.end)win()}

/* ===== Render ===== */
const gl=(c,b)=>{g.shadowColor=c;g.shadowBlur=O.p?b:0};
function draw(){const L=LV[cur],inm=state==='menu';g.setTransform(DPR*S,0,0,DPR*S,0,0);
 const cam=inm?(mt*260)%Math.max(1,lv.end-W):px-W*PXR,T=(cam+W*PXR)/L.sp,pulse=Math.pow(1-((T*L.bpm/60)%1),3),h=L.h;
 const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,hsl(h+40,70,5+pulse*5));gr.addColorStop(1,hsl(h,80,11+pulse*8));g.fillStyle=gr;g.fillRect(0,0,W,H);
 for(const s of stars){const x=((s.x-cam*s.z)%2400+2400)%2400;if(x>W)continue;g.fillStyle=hsl(h+s.c,100,75,.55);g.fillRect(x,s.y,s.s,s.s)}
 g.strokeStyle=hsl(h,100,60,.07+pulse*.12);g.lineWidth=1;g.beginPath();
 for(let v=-(cam*.5%60);v<W;v+=60){g.moveTo(v,0);g.lineTo(v,GY)}for(let y=GY;y>0;y-=45){g.moveTo(0,y);g.lineTo(W,y)}g.stroke();
 const c1=hsl(h,100,60),hz=(h+150)%360;
 for(const s of lv.segs){const a=s[0]-cam,b=s[1]-cam;if(b<0||a>W)continue;const x0=Math.max(a,-10),x1=Math.min(b,W+10);
  g.fillStyle=hsl(h,60,7);g.fillRect(x0,GY,x1-x0,H-GY);gl(c1,16);g.strokeStyle=c1;g.lineWidth=3;g.beginPath();g.moveTo(x0,GY);g.lineTo(x1,GY);
  if(a>-10){g.moveTo(a,GY);g.lineTo(a,H)}if(b<W+10){g.moveTo(b,GY);g.lineTo(b,H)}g.stroke()}
 g.shadowBlur=0;
 g.beginPath();for(const b of lv.bl){const x=b.x-cam;if(x<-b.w||x>W)continue;g.rect(x,GY-b.h,b.w,b.h)}
 g.fillStyle=hsl(h,100,60,.14);g.strokeStyle=hsl(h,100,65);g.lineWidth=2.5;gl(c1,14);g.fill();g.stroke();
 g.beginPath();for(const s of lv.ob){const x=s-cam;if(x<-40||x>W+40)continue;g.moveTo(x,GY);g.lineTo(x+U/2,GY-U);g.lineTo(x+U,GY);g.closePath()}
 g.fillStyle=hsl(hz,100,12);g.strokeStyle=hsl(hz,100,62);gl(hsl(hz,100,60),16);g.fill();g.stroke();g.shadowBlur=0;
 if(lv.cp){const x=lv.cp+5*U-cam;g.fillStyle=hsl(120,100,60,.8);g.fillRect(x,GY-70,3,70);g.fillRect(x,GY-70,22,14)}
 const fx=lv.end-cam;if(fx<W+20){gl('#fff',20);g.fillStyle='#fff';g.fillRect(fx,0,6,GY);g.shadowBlur=0;g.font='700 20px "Trebuchet MS",sans-serif';g.fillText('FINISH',fx+14,60)}
 if(!inm){g.font='700 22px "Trebuchet MS",sans-serif';g.fillStyle='rgba(255,255,255,.55)';g.fillText('Percobaan '+att,70-cam,130)}
 for(const p of pts){const a=Math.max(0,p.l/p.m);g.fillStyle=hsl(p.h,100,65,a);g.fillRect(p.x-cam,p.y,p.s*(.4+a*.6),p.s*(.4+a*.6))}
 if(state==='play'||state==='pause'){g.save();g.translate(px-cam+15,py+15);g.rotate(rot);gl(hsl(h+60,100,60),20);
  g.fillStyle=hsl(h+60,100,60);g.fillRect(-15,-15,30,30);g.shadowBlur=0;g.fillStyle=hsl(h+60,90,20);g.fillRect(-9,-9,18,18);
  g.fillStyle='#fff';g.fillRect(-6,-5,4,6);g.fillRect(3,-5,4,6);g.restore()}
 if(note>0){g.font='700 28px "Trebuchet MS",sans-serif';g.textAlign='center';g.fillStyle=hsl(120,100,70,Math.min(1,note));g.fillText('Checkpoint!',W/2,150);g.textAlign='left'}
 if(flash>0){g.fillStyle=`rgba(255,255,255,${flash*.5})`;g.fillRect(0,0,W,H)}
 if(!inm){const pc=Math.min(100,px/lv.end*100);$('fill').style.width=pc+'%';$('pc').textContent=Math.floor(pc)+'%';$('sc').textContent='Skor '+Math.floor(px/10)}}

/* ===== Loop ===== */
let last=0;
function loop(t){requestAnimationFrame(loop);const dt=Math.min((t-last)/1000||0,.05);last=t;mt+=dt;
 if(state==='play'){acc+=dt;while(acc>=1/120&&state==='play'){step(1/120);acc-=1/120}
  if(state==='play'){sched();if(O.p||R()<.5)pts.push({x:px,y:py+8+R()*14,vx:-80,vy:R()*40-20,l:.35,m:.35,h:LV[cur].h+60,s:7,g:0})}}
 else if(state==='dead'){dtimer-=dt;if(dtimer<=0)spawn(cpx)}
 if(state!=='pause'){for(const p of pts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.l-=dt}pts=pts.filter(p=>p.l>0);if(note>0)note-=dt;if(flash>0)flash-=dt*3}
 draw()}
requestAnimationFrame(loop);

/* ===== Input & UI ===== */
addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){e.preventDefault();held=true}
 if(e.code==='Escape'||e.code==='KeyP')state==='pause'?resume():pause();
 if(e.code==='KeyR'&&(state==='play'||state==='dead'))restart()});
addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code))held=false});
cv.addEventListener('pointerdown',e=>{e.preventDefault();ac();held=true});
['pointerup','pointercancel'].forEach(n=>addEventListener(n,()=>held=false));
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
document.addEventListener('click',e=>e.target.blur&&e.target.blur());
document.addEventListener('contextmenu',e=>e.preventDefault());
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>menu());
$('mPlay').onclick=()=>startLevel(cur);
$('mLv').onclick=()=>{grid();show('lvs')};
$('mSet').onclick=()=>show('set');
$('bp').onclick=pause;$('br').onclick=()=>{if(state==='play'||state==='dead')restart()};
$('pR').onclick=resume;$('pX').onclick=()=>{if(AC)AC.resume();startLevel(cur)};
$('wN').onclick=()=>startLevel(cur+1);$('wR').onclick=()=>startLevel(cur);
function grid(){const gd=$('grid');gd.innerHTML='';LV.forEach((L,i)=>{const b=sv.best[i]||{p:0,s:0},d=document.createElement('button');d.className='card';d.style.setProperty('--h',L.h);
 d.innerHTML='<b>'+(i+1)+'. '+L.n+'</b><em>'+L.d+' · '+L.bpm+' BPM</em><span>Terbaik '+b.p+'% · Skor '+b.s+'</span><i style="width:'+b.p+'%"></i>';d.onclick=()=>startLevel(i);gd.appendChild(d)})}
$('oM').checked=!!O.m;$('oS').checked=!!O.s;$('oP').checked=!!O.p;$('vM').value=O.vm;$('vS').value=O.vs;
$('oM').onchange=e=>{O.m=e.target.checked?1:0;if(!O.m)stopM();save()};
$('oS').onchange=e=>{O.s=e.target.checked?1:0;save()};
$('oP').onchange=e=>{O.p=e.target.checked?1:0;save()};
$('vM').oninput=e=>{O.vm=+e.target.value;if(mg)mg.gain.value=O.vm*.5;save()};
$('vS').oninput=e=>{O.vs=+e.target.value;save()};
</script></body></html>
